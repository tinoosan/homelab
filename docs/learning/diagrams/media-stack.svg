<svg viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Private media stack request and VPN paths</title>
  <desc id="desc">A tailnet browser reaches Tailscale Serve and loopback application ports. Sonarr, Radarr, Prowlarr, Transmission and FlareSolverr share Gluetun's network namespace and use its VPN tunnel for outbound internet traffic. Host download and media directories remain outside the containers.</desc>
  <style>.box{fill:#182235;stroke:#78a9ff;stroke-width:3}.vpn{fill:#1f2f2b;stroke:#63d3a5;stroke-width:3}.store{fill:#30283d;stroke:#c6a0f6;stroke-width:3}.label{fill:#f4f7fb;font:700 22px sans-serif}.small{fill:#c8d2e1;font:16px sans-serif}.line{fill:none;stroke:#78a9ff;stroke-width:4}.vline{fill:none;stroke:#63d3a5;stroke-width:4}.sline{fill:none;stroke:#c6a0f6;stroke-width:4}</style>
  <rect class="box" x="35" y="65" width="180" height="90" rx="18"/>
  <text class="label" x="125" y="105" text-anchor="middle">Your device</text>
  <text class="small" x="125" y="132" text-anchor="middle">Tailnet browser</text>
  <rect class="box" x="285" y="65" width="190" height="90" rx="18"/>
  <text class="label" x="380" y="105" text-anchor="middle">Tailscale Serve</text>
  <text class="small" x="380" y="132" text-anchor="middle">HTTPS to loopback</text>
  <path class="line" d="M215 110 L285 110"/>
  <rect class="vpn" x="545" y="25" width="420" height="300" rx="22"/>
  <text class="label" x="755" y="62" text-anchor="middle">Gluetun network namespace</text>
  <text class="small" x="755" y="88" text-anchor="middle">DNS, firewall and VPN tunnel</text>
  <rect class="box" x="575" y="115" width="165" height="70" rx="14"/>
  <text class="label" x="657" y="157" text-anchor="middle">Sonarr / Radarr</text>
  <rect class="box" x="770" y="115" width="165" height="70" rx="14"/>
  <text class="label" x="852" y="157" text-anchor="middle">Prowlarr</text>
  <rect class="box" x="575" y="215" width="165" height="70" rx="14"/>
  <text class="label" x="657" y="257" text-anchor="middle">Transmission</text>
  <rect class="box" x="770" y="215" width="165" height="70" rx="14"/>
  <text class="label" x="852" y="257" text-anchor="middle">FlareSolverr</text>
  <path class="line" d="M475 110 L545 110 L545 150 L575 150"/>
  <path class="vline" d="M965 175 L995 175"/>
  <text class="small" x="948" y="310" text-anchor="end">Outbound only through VPN</text>
  <rect class="store" x="545" y="385" width="190" height="95" rx="18"/>
  <text class="label" x="640" y="425" text-anchor="middle">/downloads</text>
  <text class="small" x="640" y="452" text-anchor="middle">Shared host path</text>
  <rect class="store" x="775" y="385" width="190" height="95" rx="18"/>
  <text class="label" x="870" y="425" text-anchor="middle">/mnt/gdrive</text>
  <text class="small" x="870" y="452" text-anchor="middle">Media via rclone</text>
  <path class="sline" d="M657 285 L657 385"/>
  <path class="sline" d="M700 285 L870 385"/>
</svg>
