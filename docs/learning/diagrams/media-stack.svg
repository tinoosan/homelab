<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 420 760" role="img" aria-labelledby="media-stack-title media-stack-desc">
<title id="media-stack-title">Private access and VPN traffic in the media stack</title>
<desc id="media-stack-desc">A tailnet browser reaches the applications through Tailscale Serve and host loopback. The media applications share the Gluetun network namespace. Their external traffic can leave only through the VPN. Downloads and media remain in host storage outside the containers.</desc>
<style>.diagram text{font-family:system-ui,sans-serif;font-size:16px;fill:var(--ink,#242b35)}.diagram .small{font-size:13px}.diagram .title{font-size:18px;font-weight:700}.diagram .boundary{fill:var(--paper,#fafbfc);stroke:#23834b;stroke-width:2}.diagram .private{fill:#e8e4fb;stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .service{fill:var(--code,#edf0f4);stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .storage{fill:#fff0bd;stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .arrow{fill:none;stroke:var(--link,#1856a0);stroke-width:2}.diagram .vpn{fill:none;stroke:#23834b;stroke-width:2}.diagram .arrowhead{fill:var(--link,#1856a0)}.diagram .vpnhead{fill:#23834b}</style>
<rect class="private" x="35" y="15" width="350" height="65" rx="8"/><text class="title" x="210" y="42" text-anchor="middle">Your device</text><text class="small" x="210" y="64" text-anchor="middle">Authorized tailnet browser</text>
<path class="arrow" d="M210 80v42"/><path class="arrowhead" d="M204 116l6 10 6-10z"/><text class="small" x="225" y="105">private HTTPS</text>
<rect class="private" x="35" y="130" width="350" height="70" rx="8"/><text class="title" x="210" y="158" text-anchor="middle">Tailscale Serve</text><text class="small" x="210" y="181" text-anchor="middle">TLS ends here, then HTTP uses host loopback</text>
<path class="arrow" d="M210 200v42"/><path class="arrowhead" d="M204 236l6 10 6-10z"/><text class="small" x="225" y="225">private app ports</text>
<rect class="boundary" x="15" y="250" width="390" height="300" rx="10"/><text class="title" x="35" y="282">Gluetun network namespace</text><text class="small" x="35" y="304">Shared DNS, firewall and VPN tunnel</text>
<rect class="service" x="35" y="330" width="160" height="72" rx="7"/><text x="115" y="360" text-anchor="middle">Sonarr / Radarr</text><text class="small" x="115" y="384" text-anchor="middle">automation</text>
<rect class="service" x="225" y="330" width="160" height="72" rx="7"/><text x="305" y="360" text-anchor="middle">Prowlarr</text><text class="small" x="305" y="384" text-anchor="middle">search</text>
<rect class="service" x="35" y="435" width="160" height="72" rx="7"/><text x="115" y="465" text-anchor="middle">Transmission</text><text class="small" x="115" y="489" text-anchor="middle">downloads</text>
<rect class="service" x="225" y="435" width="160" height="72" rx="7"/><text x="305" y="465" text-anchor="middle">FlareSolverr</text><text class="small" x="305" y="489" text-anchor="middle">web challenges</text>
<path class="vpn" d="M210 550v78"/><path class="vpnhead" d="M204 622l6 10 6-10z"/><text class="small" x="225" y="590">external traffic: VPN only</text><text class="title" x="210" y="653" text-anchor="middle">Internet</text>
<path class="arrow" d="M115 507v177"/><path class="arrowhead" d="M109 678l6 10 6-10z"/><path class="arrow" d="M195 366h210v318"/><path class="arrowhead" d="M399 678l6 10 6-10z"/>
<rect class="storage" x="20" y="690" width="180" height="55" rx="7"/><text x="110" y="716" text-anchor="middle">/downloads</text><text class="small" x="110" y="735" text-anchor="middle">shared host path</text>
<rect class="storage" x="220" y="690" width="180" height="55" rx="7"/><text x="310" y="716" text-anchor="middle">/mnt/gdrive/Videos</text><text class="small" x="310" y="735" text-anchor="middle">media through rclone</text>
</svg>
