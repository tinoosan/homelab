<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 380 466" role="img" aria-labelledby="n8n-network-title n8n-network-desc">
<title id="n8n-network-title">How a private n8n request reaches the container</title><desc id="n8n-network-desc">A tailnet browser connects over HTTPS to Tailscale Serve port 8443 on Mugiwara. Serve terminates TLS and forwards HTTP to host loopback port 5678. Docker publishes that port to n8n container port 5678.</desc>
<style>.diagram text{font-family:system-ui,sans-serif;font-size:16px;fill:var(--ink,#242b35)}.diagram .small{font-size:14px}.diagram rect{fill:var(--code,#edf0f4);stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .arrow{fill:none;stroke:var(--link,#1856a0);stroke-width:2}.diagram .arrowhead{fill:var(--link,#1856a0)}</style>
<rect x="15" y="10" width="350" height="72" rx="6"/><text x="190" y="38" text-anchor="middle">Your browser</text><text class="small" x="190" y="62" text-anchor="middle">Authorized device on the tailnet</text><path class="arrow" d="M190 82v44"/><path class="arrowhead" d="M184 120l6 10 6-10z"/><text class="small" x="205" y="109">HTTPS :8443</text><rect x="15" y="134" width="350" height="72" rx="6"/><text x="190" y="162" text-anchor="middle">Tailscale Serve on Mugiwara</text><text class="small" x="190" y="186" text-anchor="middle">TLS ends here, private access remains</text><path class="arrow" d="M190 206v44"/><path class="arrowhead" d="M184 244l6 10 6-10z"/><text class="small" x="205" y="233">HTTP, same host</text><rect x="15" y="258" width="350" height="72" rx="6"/><text x="190" y="286" text-anchor="middle">Host loopback</text><text class="small" x="190" y="310" text-anchor="middle">127.0.0.1:5678</text><path class="arrow" d="M190 330v44"/><path class="arrowhead" d="M184 368l6 10 6-10z"/><text class="small" x="205" y="357">Docker port mapping</text><rect x="15" y="382" width="350" height="72" rx="6"/><text x="190" y="410" text-anchor="middle">n8n container</text><text class="small" x="190" y="434" text-anchor="middle">Application listens on port 5678</text>
</svg>
