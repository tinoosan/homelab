<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 380 434" role="img" aria-labelledby="container-volume-title container-volume-desc">
<title id="container-volume-title">What survives container replacement</title><desc id="container-volume-desc">A pinned image supplies a replaceable container. The named volume n8n_data mounts at /home/node/.n8n and retains the database and encryption key when the container is replaced. Removing the volume or losing the disk still loses that data.</desc>
<style>.diagram text{font-family:system-ui,sans-serif;font-size:16px;fill:var(--ink,#242b35)}.diagram .small{font-size:14px}.diagram rect{fill:var(--code,#edf0f4);stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .arrow{fill:none;stroke:var(--link,#1856a0);stroke-width:2}.diagram .arrowhead{fill:var(--link,#1856a0)}</style>
<rect x="15" y="10" width="350" height="72" rx="6"/><text x="190" y="38" text-anchor="middle">Pinned n8n image</text><text class="small" x="190" y="62" text-anchor="middle">Read-only application and runtime</text><path class="arrow" d="M190 82v44"/><path class="arrowhead" d="M184 120l6 10 6-10z"/><text class="small" x="205" y="109">creates</text><rect x="15" y="134" width="350" height="72" rx="6"/><text x="190" y="162" text-anchor="middle">Replaceable container</text><text class="small" x="190" y="186" text-anchor="middle">Its own writable layer is disposable</text><path class="arrow" d="M190 206v44"/><path class="arrowhead" d="M184 216l6-10 6 10z"/><path class="arrowhead" d="M184 244l6 10 6-10z"/><text class="small" x="205" y="233">reads and writes</text><rect x="15" y="258" width="350" height="72" rx="6"/><text x="190" y="286" text-anchor="middle">Retained volume: n8n_data</text><text class="small" x="190" y="310" text-anchor="middle">Mounted at /home/node/.n8n</text><text x="190" y="363" text-anchor="middle">Database + settings + encryption key</text><text class="small" x="190" y="392" text-anchor="middle">Container recreation keeps this volume.</text><text class="small" x="190" y="418" text-anchor="middle">down -v can delete it. Disk loss can too.</text>
</svg>
