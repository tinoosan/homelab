<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 380 466" role="img" aria-labelledby="drawing-files-title drawing-files-desc">
<title id="drawing-files-title">Where your drawing becomes a backup</title><desc id="drawing-files-desc">The application container delivers editor code to your browser, not a backed-up folder of drawings. Excalidraw browser state and draw.io browser or device storage need explicit editable file saves. Save an excalidraw or drawio file, copy it to separate storage, and reopen it to check recovery.</desc>
<style>.diagram text{font-family:system-ui,sans-serif;font-size:16px;fill:var(--ink,#242b35)}.diagram .small{font-size:14px}.diagram rect{fill:var(--code,#edf0f4);stroke:var(--line,#8290a2);stroke-width:1.5}.diagram .arrow{fill:none;stroke:var(--link,#1856a0);stroke-width:2}.diagram .arrowhead{fill:var(--link,#1856a0)}</style>
<rect x="15" y="10" width="350" height="72" rx="6"/><text x="190" y="38" text-anchor="middle">Application container</text><text class="small" x="190" y="62" text-anchor="middle">Delivers the editor, not your file backup</text><path class="arrow" d="M190 82v44"/><path class="arrowhead" d="M184 120l6 10 6-10z"/><text class="small" x="205" y="109">loads code</text><rect x="15" y="134" width="350" height="72" rx="6"/><text x="190" y="162" text-anchor="middle">Drawing in your browser</text><text class="small" x="190" y="186" text-anchor="middle">Browser state can be cleared or lost</text><path class="arrow" d="M190 206v44"/><path class="arrowhead" d="M184 244l6 10 6-10z"/><text class="small" x="205" y="233">save editable file</text><rect x="15" y="258" width="350" height="72" rx="6"/><text x="190" y="286" text-anchor="middle">.excalidraw or .drawio file</text><text class="small" x="190" y="310" text-anchor="middle">Choose Device / Save to file</text><path class="arrow" d="M190 330v44"/><path class="arrowhead" d="M184 368l6 10 6-10z"/><text class="small" x="205" y="357">copy and reopen</text><rect x="15" y="382" width="350" height="72" rx="6"/><text x="190" y="410" text-anchor="middle">Separate backup storage</text><text class="small" x="190" y="434" text-anchor="middle">Keep editable originals with image exports</text>
</svg>
