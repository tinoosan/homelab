apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # Common useful toggles you can set later:
    defaultSettings:
      defaultReplicaCount: 2   # for small clusters; 3 if you have >=3 nodes
      replicaSoftAntiAffinity: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      backupTarget: nfs://192.168.0.90:/srv/longhorn-backups
      backupstorePollInterval: 300
      recurringSuccessfulJobsHistoryLimit: 3
      recurringFailedJobsHistoryLimit: 3
    recurringJobs:
      - name: daily-snapshot
        task: snapshot
        cron: "15 3 * * *"
        retain: 7
        groups:
          - default
      - name: weekly-backup
        task: backup
        cron: "45 3 * * 0"
        retain: 4
        groups:
          - default
