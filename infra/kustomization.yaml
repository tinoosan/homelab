apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Core controllers (external manifests)
  - https://raw.githubusercontent.com/metallb/metallb/v0.15.2/config/manifests/metallb-native.yaml
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.3/deploy/static/provider/cloud/deploy.yaml
  # In-house infra modules
  - longhorn
  - metallb/base
  - metrics-server
  - keycloak/base
  - networking/cloudflared
patches:
  - path: ingress-nginx/delete-admission-create-job.yaml
  - path: ingress-nginx/delete-admission-patch-job.yaml
  - path: metallb/patch-controller-resources.yaml
